name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-gh-pages"
  cancel-in-progress: true

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          node node_modules/esbuild/install.js || true

      - name: Build Vite production bundle
        run: npm run build

      - name: Pre-Deploy Broken-Push Test Gate (Topology, 3D Visibility, Solvability, dist/ Audit)
        run: |
          node scripts/verify_build.mjs
          node scripts/test_3d_visibility.mjs
          node scripts/test_solvability_solver.mjs
          node scripts/test_board_integration.mjs --check-dist

      - name: Publish ./dist to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: "Deploy to GitHub Pages from ${{ github.sha }}"
